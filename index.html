<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MindAR Image Tracking - Video</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }

    video, canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    #hint {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: sans-serif;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      z-index: 999;
    }
    video {
    image-rendering: auto;
    filter: contrast(1.05) saturate(1.05);
    }
  </style>
</head>

<body>

<div id="hint">Point camera at the image</div>
<script>
  navigator.mediaDevices.getUserMedia = (constraints => {
    constraints.video = {
      facingMode: "environment",
      width: { ideal: 1920 },
      height: { ideal: 1080 }
    };
    return navigator.mediaDevices.__proto__.getUserMedia.call(navigator.mediaDevices, constraints);
  });
</script>
<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true; facingMode: environment;"
  renderer="precision: high; antialias: true; colorManagement: true; physicallyCorrectLights: true;"
  color-space="sRGB"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <a-assets>
    <!-- YOUR VIDEO -->
    <video
      id="video"
      src="v3.mp4"
      loop
      muted
      playsinline
      webkit-playsinline
      crossorigin="anonymous"
    ></video>
  </a-assets>

  <!-- IMAGE TARGET -->
  <a-entity mindar-image-target="targetIndex: 0;">

    <a-video
      id="videoPlane"
      src="#video"  
      width="0.6"
      height="1"
      position="0 0 0"
      visible="false"
    ></a-video>

  </a-entity>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

</a-scene>

<script>
  const video = document.getElementById("video");
  const videoPlane = document.getElementById("videoPlane");
  const target = document.querySelector('[mindar-image-target]');

  // When image is found
  target.addEventListener("targetFound", () => {
    console.log("TARGET FOUND");

    videoPlane.setAttribute("visible", true);
    video.play();

    document.getElementById("hint").innerText = "Playing video...";
  });

  // When image is lost
  target.addEventListener("targetLost", () => {
    console.log("TARGET LOST");

    video.pause();
    videoPlane.setAttribute("visible", false);

    document.getElementById("hint").innerText = "Point camera at the image";
  });

  // Mobile autoplay fix
  document.body.addEventListener("click", () => {
    video.play().then(() => video.pause());
  });
</script>

</body>
</html>
